<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>PipelinePro Redirect</title>
    <script type="text/javascript">
      // Simple SPA redirect for GitHub Pages
      var l = window.location;
      // This will redirect /auth/callback to /?p=/auth/callback
      var path = l.pathname.replace(/^\/|\/$/g, '');
      var query = l.search ? l.search.replace(/&/g, '~and~') : '';
      var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/?p=' + path + (query ? '&q=' + query : '') + l.hash;
      l.replace(redirectUrl);
    </script>
  </head>
  <body>
  </body>
</html>
